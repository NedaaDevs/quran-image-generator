name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-version binaries (smaller, single version bundled)
          - runner: ubuntu-latest
            target: bun-linux-x64
            artifact: quran-gen-v1-linux-x64
            versions: v1
          - runner: ubuntu-latest
            target: bun-linux-x64
            artifact: quran-gen-v2-linux-x64
            versions: v2
          - runner: ubuntu-latest
            target: bun-linux-x64
            artifact: quran-gen-v4-linux-x64
            versions: v4
          - runner: macos-latest
            target: bun-darwin-arm64
            artifact: quran-gen-v1-darwin-arm64
            versions: v1
          - runner: macos-latest
            target: bun-darwin-arm64
            artifact: quran-gen-v2-darwin-arm64
            versions: v2
          - runner: macos-latest
            target: bun-darwin-arm64
            artifact: quran-gen-v4-darwin-arm64
            versions: v4
          - runner: windows-latest
            target: bun-windows-x64
            artifact: quran-gen-v1-windows-x64
            versions: v1
          - runner: windows-latest
            target: bun-windows-x64
            artifact: quran-gen-v2-windows-x64
            versions: v2
          - runner: windows-latest
            target: bun-windows-x64
            artifact: quran-gen-v4-windows-x64
            versions: v4
          # All-in-one binaries — one matrix entry per native runner to avoid
          # cross-arch pngquant/Skia .node mismatches.
          - runner: ubuntu-latest
            target: bun-linux-x64
            artifact: quran-gen-linux-x64
            versions: v1 v2 v4
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: quran-gen-linux-arm64
            versions: v1 v2 v4
          - runner: macos-latest
            target: bun-darwin-arm64
            artifact: quran-gen-darwin-arm64
            versions: v1 v2 v4
          - runner: windows-latest
            target: bun-windows-x64
            artifact: quran-gen-windows-x64
            versions: v1 v2 v4
          # darwin-x64 (Intel macOS) intentionally omitted: GitHub-hosted macos-13
          # runners queue too long to be useful. Apple Silicon binary covers
          # virtually all users; revisit if x64 demand surfaces.

    runs-on: ${{ matrix.runner }}

    # Git Bash on Windows runners, so every step uses the same POSIX script.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Download assets from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download assets -D data/ -p "common.zip"
          (cd data && unzip -o -q common.zip && rm common.zip)
          for v in ${{ matrix.versions }}; do
            gh release download assets -D data/ -p "${v}.zip"
            (cd data && unzip -o -q "${v}.zip" && rm "${v}.zip")
          done

      - name: Package assets tarball
        run: |
          dirs="common"
          for v in ${{ matrix.versions }}; do dirs="$dirs $v"; done
          (cd data && tar -cf ../assets.tar $dirs)

      - name: Install pngquant from apt (linux-arm64)
        # pngquant-bin has no arm64 prebuilt and can't compile on the runner.
        if: matrix.target == 'bun-linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y pngquant

      - name: Build binary with embedded assets
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          # `--external canvas` keeps the Cairo native binding (and its 15
          # sibling dylibs) out of the bundle. Skia (@napi-rs/canvas) ships a
          # single self-contained .node and is the only required engine.
          bun build src/cli.ts assets.tar --compile --external canvas --target="$TARGET" --outfile "$ARTIFACT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Bun appends .exe to Windows outfiles; Windows users expect a .zip.
            cp node_modules/pngquant-bin/vendor/pngquant.exe pngquant.exe
            # Skia needs ICU data; the binary unpacks its .node to a temp dir,
            # so Skia finds icudtl.dat only next to the .exe.
            cp node_modules/@napi-rs/canvas-win32-x64-msvc/icudtl.dat icudtl.dat
            7z a -tzip "$ARTIFACT.zip" "$ARTIFACT.exe" pngquant.exe icudtl.dat
          else
            if [ -x node_modules/pngquant-bin/vendor/pngquant ]; then
              cp node_modules/pngquant-bin/vendor/pngquant pngquant
            else
              cp "$(command -v pngquant)" pngquant
            fi
            tar czf "$ARTIFACT.tar.gz" "$ARTIFACT" pngquant
          fi

      - name: Smoke-test the packaged binary
        # Fresh dir, as on a user's first launch: asset unpack, Skia, pngquant.
        # Render every bundled version — V4 takes a different Skia text path.
        env:
          ARTIFACT: ${{ matrix.artifact }}
          VERSIONS: ${{ matrix.versions }}
        run: |
          mkdir smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd smoke && 7z x -y "../$ARTIFACT.zip" > /dev/null)
            bin="./$ARTIFACT.exe"
          else
            tar xzf "$ARTIFACT.tar.gz" -C smoke
            bin="./$ARTIFACT"
          fi
          cd smoke
          for v in $VERSIONS; do
            "$bin" 1 1 360 page "$v" quantize
            [ -n "$(find "output/$v" -name '*.png' -print -quit)" ]
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" quran-gen-*.tar.gz quran-gen-*.zip --clobber
